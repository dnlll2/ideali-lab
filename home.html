<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home — Ideali Laboratório</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<style>
  .home-col{background:#1a1d27;border:0.5px solid rgba(255,255,255,0.08);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
  .home-col-head{padding:10px 16px;border-bottom:0.5px solid rgba(255,255,255,0.08);background:#13151f;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .home-col-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em}
  .home-col-badge{font-size:11px;padding:2px 8px;border-radius:6px;background:#22263a;color:#64748b;font-weight:600}
  .home-ticker-vp{height:320px;overflow:hidden;position:relative}
  .home-ticker-list{display:flex;flex-direction:column;will-change:transform}
  .home-ticker-row{height:64px;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0;border-bottom:0.5px solid rgba(255,255,255,0.05);flex-shrink:0;overflow:hidden;cursor:pointer;transition:background 0.12s}
  .home-ticker-row:hover{background:rgba(255,255,255,0.04) !important}
  @media(max-width:767px){#home-grid{grid-template-columns:1fr !important}}
</style>
</head>
<body>
<div id="shared-shell"></div>

<div style="max-width:100%">
  <div id="app-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="hamburger" onclick="openSidebar()" title="Menu">&#9776;</button>
      <div>
        <p style="font-size:22px;font-weight:500;color:#f1f5f9">🏠 Home</p>
        <p style="font-size:14px;color:#64748b">Visão geral do laboratório</p>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span id="relogio" style="font-size:11px;color:#4a5568"></span>
      <span id="sync-status" style="font-size:12px;color:#64748b">
        <span class="sync-dot" id="sync-dot"></span>Conectado
      </span>
    </div>
  </div>

  <main id="page-content">
    <div style="margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <p id="home-subtitle" style="font-size:12px;color:#64748b">Carregando...</p>
      <button onclick="loadHomeData()" style="display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.1);background:#22263a;color:#94a3b8;font-size:13px;cursor:pointer;font-family:inherit;transition:all 0.15s" onmouseover="this.style.background='#2d3250';this.style.color='#e2e8f0'" onmouseout="this.style.background='#22263a';this.style.color='#94a3b8'">&#8635; Atualizar</button>
    </div>

    <div id="home-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
      <div class="home-col">
        <div class="home-col-head">
          <span class="home-col-title" style="color:#93c5fd">📦 Pedidos</span>
          <span id="home-count-pedidos" class="home-col-badge">0</span>
        </div>
        <div class="home-ticker-vp" id="home-vp-pedidos"
             onmouseenter="homeTickerPause('pedidos')" onmouseleave="homeTickerResume('pedidos')">
          <div class="home-ticker-list" id="home-list-pedidos"></div>
        </div>
      </div>
      <div class="home-col">
        <div class="home-col-head">
          <span class="home-col-title" style="color:#fca5a5">🚨 Urgência</span>
          <span id="home-count-urgencia" class="home-col-badge">0</span>
        </div>
        <div class="home-ticker-vp" id="home-vp-urgencia"
             onmouseenter="homeTickerPause('urgencia')" onmouseleave="homeTickerResume('urgencia')">
          <div class="home-ticker-list" id="home-list-urgencia"></div>
        </div>
      </div>
      <div class="home-col">
        <div class="home-col-head">
          <span class="home-col-title" style="color:#c4b5fd">📋 Lembretes</span>
          <span id="home-count-lembretes" class="home-col-badge">0</span>
        </div>
        <div class="home-ticker-vp" id="home-vp-lembretes"
             onmouseenter="homeTickerPause('lembretes')" onmouseleave="homeTickerResume('lembretes')">
          <div class="home-ticker-list" id="home-list-lembretes"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
var TICKER_ROWS = 5;
var TICKER_ROW_H = 64;
var homeAllItems  = { pedidos: [], urgencia: [], lembretes: [] };
var homeTickerState = {
  pedidos:   { offset:0, timer:null, paused:false, animating:false },
  urgencia:  { offset:0, timer:null, paused:false, animating:false },
  lembretes: { offset:0, timer:null, paused:false, animating:false }
};

async function loadHomeData() {
  var sub = document.getElementById('home-subtitle');
  if (sub) sub.textContent = 'Carregando...';
  ['pedidos','urgencia','lembretes'].forEach(function(col) {
    var el = document.getElementById('home-list-'+col);
    if (el) el.innerHTML = homeTickerEmptyRows('...');
  });
  try {
    var resPedidos = await sb.from('pedidos').select('*').neq('status','finalizado').neq('status','entregue').neq('status','cancelado');
    var resTarefas = await sb.from('tarefas').select('*').eq('concluida',false).eq('arquivada',false);
    var pedidosAll = resPedidos.error ? [] : (resPedidos.data || []);
    var tarefasAll = resTarefas.error ? [] : (resTarefas.data || []);
    pedidosAll.sort(function(a,b){ return (a.created_at||'').localeCompare(b.created_at||''); });
    homeAllItems.pedidos = pedidosAll;

    var resUrg = await sb.from('pedidos').select('*').eq('urgente', true)
      .neq('status','finalizado').neq('status','entregue').neq('status','cancelado');
    if (resUrg.error) {
      homeAllItems.urgencia = [];
    } else {
      var urgAll = resUrg.data || [];
      urgAll.sort(function(a,b){ return (a.created_at||'').localeCompare(b.created_at||''); });
      homeAllItems.urgencia = urgAll;
    }
    var comPrazo = tarefasAll.filter(function(t){ return !!t.data_prazo; })
                   .sort(function(a,b){ return a.data_prazo.localeCompare(b.data_prazo); });
    var semPrazo = tarefasAll.filter(function(t){ return !t.data_prazo; })
                   .sort(function(a,b){ return (a.created_at||'').localeCompare(b.created_at||''); });
    homeAllItems.lembretes = comPrazo.concat(semPrazo);
  } catch(e) {
    console.error('loadHomeData:', e);
    homeAllItems = { pedidos:[], urgencia:[], lembretes:[] };
  }
  ['pedidos','urgencia','lembretes'].forEach(function(col) {
    homeTickerState[col].offset = 0;
    homeTickerState[col].animating = false;
    homeTickerStop(col);
  });
  renderAllTickers();
  startAllTickers();
  if (sub) sub.textContent = todayLabel();
}

function ageRowStyle(createdAt) {
  if (!createdAt) return '';
  var today   = new Date(); today.setHours(0,0,0,0);
  var created = new Date(createdAt); created.setHours(0,0,0,0);
  var days    = Math.round((today - created) / 86400000);
  if (days >= 7) return 'background:rgba(239,68,68,0.12);border-left:3px solid #ef4444';
  if (days >= 5) return 'background:rgba(249,115,22,0.10);border-left:3px solid #f97316';
  if (days >= 3) return 'background:rgba(251,191,36,0.08);border-left:3px solid #fbbf24';
  return '';
}

function homeTickerRowHTML(item, tipo) {
  var style  = ageRowStyle(item.created_at);
  var paddingLeft = style ? '11px' : '14px';
  var clienteN, desc, reg;
  if (tipo === 'lembrete') {
    var _c = clients.find(function(x){ return x.reg == item.cliente_reg; });
    clienteN = _c ? _c.nome : (item.cliente_reg ? '—' : '—');
    desc = item.texto || item.descricao || 'Tarefa';
    reg  = item.cliente_reg || 0;
  } else {
    clienteN = item.cliente_reg ? cliNomePed(item.cliente_reg) : '—';
    desc = item.descricao || '—';
    reg  = item.cliente_reg || 0;
  }
  var urgIcon = (item.urgente) ? '🚨 ' : '';
  var clickAttr = reg ? ' onclick="homeClickItem('+reg+',\''+tipo+'\')"' : '';
  return '<div class="home-ticker-row"'+clickAttr+' style="'+style+';padding-left:'+paddingLeft+';padding-right:14px">'+
    '<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;font-size:15px;font-weight:700;color:#f1f5f9;line-height:1.2">'+urgIcon+escHtml(clienteN)+'</div>'+
    '<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;font-size:12px;color:#94a3b8;line-height:1.2">'+escHtml(desc)+'</div>'+
  '</div>';
}

function homeClickItem(reg, tipo) {
  if (!reg) return;
  if (tipo === 'lembrete') {
    localStorage.setItem('ideali-tarefas-autoselect', reg);
    window.location.href = 'tarefas.html';
  } else {
    localStorage.setItem('ideali-cr-autoselect', reg);
    window.location.href = 'contas-receber.html';
  }
}

function homeTickerEmptyRows(msg) {
  var html = '';
  for (var i = 0; i < TICKER_ROWS; i++) {
    html += '<div class="home-ticker-row" style="justify-content:center">'+
      '<span style="font-size:11px;color:#4a5568">'+(i===0?msg:'')+'</span></div>';
  }
  return html;
}

function renderTicker(col) {
  var listEl  = document.getElementById('home-list-'+col);
  var countEl = document.getElementById('home-count-'+col);
  if (!listEl) return;
  var items = homeAllItems[col] || [];
  if (countEl) countEl.textContent = items.length;
  if (!items.length) {
    var msgs = { pedidos:'Sem pedidos em aberto', urgencia:'Sem urgências', lembretes:'Sem tarefas abertas' };
    listEl.innerHTML = homeTickerEmptyRows(msgs[col]||'—');
    listEl.style.transform = 'translateY(0)';
    listEl.style.transition = 'none';
    return;
  }
  var offset = homeTickerState[col].offset;
  var tipo   = col === 'lembretes' ? 'lembrete' : 'pedido';
  var html = '';
  for (var i = 0; i <= TICKER_ROWS; i++) {
    html += homeTickerRowHTML(items[(offset + i) % items.length], tipo);
  }
  listEl.innerHTML = html;
  listEl.style.transition = 'none';
  listEl.style.transform  = 'translateY(0)';
}

function renderAllTickers() {
  ['pedidos','urgencia','lembretes'].forEach(renderTicker);
}

function homeTickerAdvance(col) {
  var state = homeTickerState[col];
  var items = homeAllItems[col] || [];
  if (items.length <= 1 || state.animating) return;
  var listEl = document.getElementById('home-list-'+col);
  if (!listEl) return;
  state.animating = true;
  listEl.style.transition = 'transform 0.38s cubic-bezier(0.4,0,0.2,1)';
  listEl.style.transform  = 'translateY(-'+TICKER_ROW_H+'px)';
  setTimeout(function() {
    state.offset    = (state.offset + 1) % items.length;
    state.animating = false;
    renderTicker(col);
  }, 400);
}

function startAllTickers() {
  ['pedidos','urgencia','lembretes'].forEach(function(col) {
    homeTickerStop(col);
    if ((homeAllItems[col]||[]).length <= 1) return;
    homeTickerState[col].timer = setInterval(function() {
      if (!homeTickerState[col].paused) homeTickerAdvance(col);
    }, 5000);
  });
}

function homeTickerStop(col) {
  if (homeTickerState[col] && homeTickerState[col].timer) {
    clearInterval(homeTickerState[col].timer);
    homeTickerState[col].timer = null;
  }
}

function homeTickerPause(col)  { if (homeTickerState[col]) homeTickerState[col].paused = true; }
function homeTickerResume(col) { if (homeTickerState[col]) homeTickerState[col].paused = false; }

function initShell() {
  return fetch('sidebar.html')
    .then(function(r) { return r.text(); })
    .then(function(html) {
      document.getElementById('shared-shell').innerHTML = html;
      updateSidebarActive();
      var keyEl = document.getElementById('sb-groq-key');
      if (keyEl && GROQ_API_KEY) keyEl.value = GROQ_API_KEY;
    })
    .catch(function(e) { console.error('Erro ao carregar sidebar.html:', e); });
}

function hideLoading() {
  var el = document.getElementById('loading-overlay');
  if (el) el.style.display = 'none';
}

async function init() {
  hideLoading();
  await loadHomeData();
}

initShell().then(function() { if (typeof init === 'function') init(); });
</script>
</body>
</html>
