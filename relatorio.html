<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório Mensal - Ideali Laboratório</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;padding:1.25rem;min-height:100vh}
.page{max-width:960px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px}
.header-left h1{font-size:22px;font-weight:600;color:#f1f5f9}
.header-left p{font-size:13px;color:#64748b;margin-top:2px}
.badge-ro{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;border-radius:6px;background:#1a2a40;color:#60a5fa;border:0.5px solid rgba(96,165,250,0.3);font-weight:500}
.month-nav{display:flex;align-items:center;gap:8px}
.nav-btn{width:34px;height:34px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.12);background:#22263a;color:#94a3b8;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.nav-btn:hover{background:#2d3250;color:#e2e8f0}
.month-label{font-size:14px;font-weight:500;color:#e2e8f0;min-width:130px;text-align:center}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
.sum-card{background:#1a1d27;border:0.5px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px 16px}
.sum-card .lbl{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
.sum-card .val{font-size:20px;font-weight:600;color:#f1f5f9}
.sum-card .sub{font-size:11px;color:#64748b;margin-top:2px}
.table-wrap{background:#1a1d27;border:0.5px solid rgba(255,255,255,0.08);border-radius:12px;overflow:hidden}
.rel-table{width:100%;border-collapse:collapse}
.rel-table th{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;padding:11px 14px;text-align:left;border-bottom:0.5px solid rgba(255,255,255,0.08);background:#1a1d27;white-space:nowrap;position:sticky;top:0;z-index:1}
.rel-table td{padding:11px 14px;border-bottom:0.5px solid rgba(255,255,255,0.05);color:#e2e8f0;vertical-align:middle}
.rel-table tbody tr:last-child td{border-bottom:none}
.rel-table tbody tr:hover td{background:rgba(255,255,255,0.025)}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.name-cell{display:flex;align-items:center;gap:9px}
.client-name{font-size:13px;font-weight:500;color:#e2e8f0}
.client-city{font-size:11px;color:#64748b;margin-top:1px}
.tick{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%}
.tick.on{background:#0d3d2b;border:0.5px solid #22c55e;color:#22c55e}
.tick.off{background:#22263a;border:0.5px solid rgba(255,255,255,0.1);color:#4a5568}
.ticks-row{display:flex;gap:5px;align-items:center}
.tick-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.tick-lbl{font-size:9px;color:#4a5568;line-height:1}
.tick-lbl.on{color:#22c55e}
.status-badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:6px;white-space:nowrap}
.status-q{background:#0d3d2b;color:#4ade80;border:0.5px solid #22c55e}
.status-e{background:#0d3d2b;color:#4ade80;border:0.5px solid #22c55e}
.status-r{background:#1d3a6e;color:#93c5fd;border:0.5px solid rgba(96,165,250,0.5)}
.status-p{background:#22263a;color:#64748b;border:0.5px solid rgba(255,255,255,0.08)}
.valor-mes{font-size:13px;color:#fbbf24;font-weight:500;white-space:nowrap}
.valor-pago{font-size:13px;color:#22c55e;font-weight:500;white-space:nowrap}
.valor-zero{color:#4a5568}
.comp-btn{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:6px;border:0.5px solid rgba(96,165,250,0.4);background:#1a2a40;color:#60a5fa;font-size:11px;font-weight:500;cursor:pointer;text-decoration:none;transition:all 0.15s;white-space:nowrap;font-family:inherit}
.comp-btn:hover{background:#1d3a6e;border-color:#3b82f6}
.no-comp{font-size:11px;color:#4a5568}
.loading{text-align:center;padding:40px;color:#64748b;font-size:13px}
.spinner{width:28px;height:28px;border:2.5px solid rgba(255,255,255,0.08);border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#3d1d1d;border:0.5px solid #ef4444;border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.error-box i{font-size:18px;color:#ef4444;flex-shrink:0}
.error-box p{font-size:13px;color:#fca5a5}
.print-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.12);background:#22263a;color:#94a3b8;font-size:13px;cursor:pointer;font-family:inherit;transition:all 0.15s}
.print-btn:hover{background:#2d3250;color:#e2e8f0}
.footer{margin-top:1.5rem;text-align:center;font-size:11px;color:#4a5568}
@media(max-width:767px){
  body{padding:0.75rem}
  .summary-grid{grid-template-columns:1fr 1fr}
  .rel-table th:nth-child(4),.rel-table td:nth-child(4),
  .rel-table th:nth-child(5),.rel-table td:nth-child(5){display:none}
  .header{gap:10px}
  .month-label{min-width:100px;font-size:13px}
}
@media print{
  body{background:#fff;color:#000;padding:0}
  .nav-btn,.print-btn,.badge-ro{display:none !important}
  .table-wrap,.sum-card{border-color:#ccc !important;background:#fff !important}
  .rel-table th{background:#f5f5f5 !important;color:#333 !important}
  .rel-table td{color:#000 !important;border-color:#eee !important}
  .client-name{color:#000 !important}
  .client-city{color:#666 !important}
  .sum-card .val{color:#000 !important}
  .sum-card .lbl,.sum-card .sub{color:#666 !important}
  .header-left h1{color:#000 !important}
  .header-left p{color:#666 !important}
  .month-label{color:#000 !important}
}
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-left">
      <h1>Ideali Laboratório</h1>
      <p>Relatório de pagamentos mensais &nbsp;<span class="badge-ro"><i class="ti ti-eye" style="font-size:11px"></i> Somente leitura</span></p>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="month-nav">
        <button class="nav-btn" onclick="changeMonth(-1)" title="Mês anterior"><i class="ti ti-chevron-left"></i></button>
        <span class="month-label" id="month-label">Carregando...</span>
        <button class="nav-btn" onclick="changeMonth(1)" title="Próximo mês"><i class="ti ti-chevron-right"></i></button>
      </div>
      <button class="print-btn" onclick="window.print()"><i class="ti ti-printer" style="font-size:14px"></i> Imprimir</button>
    </div>
  </div>

  <div id="error-area"></div>

  <div class="summary-grid" id="summary-grid">
    <div class="sum-card"><div class="lbl">Total clientes</div><div class="val" id="sum-total">-</div><div class="sub">cadastrados</div></div>
    <div class="sum-card"><div class="lbl">Quitados</div><div class="val" id="sum-quit" style="color:#4ade80">-</div><div class="sub" id="sum-quit-pct"></div></div>
    <div class="sum-card"><div class="lbl">Valor do mês</div><div class="val" id="sum-valor" style="font-size:16px;color:#fbbf24">-</div><div class="sub">total faturado</div></div>
    <div class="sum-card"><div class="lbl">Valor pago</div><div class="val" id="sum-pago" style="font-size:16px;color:#22c55e">-</div><div class="sub" id="sum-pago-pct"></div></div>
  </div>

  <div class="table-wrap">
    <div id="table-area" class="loading">
      <div class="spinner"></div>
      <p>Carregando dados...</p>
    </div>
  </div>

  <div class="footer">Ideali Laboratório · Relatório gerado em <span id="gen-date"></span></div>
</div>

<script>
var SUPABASE_URL = 'https://alqhhgysvehtgkwsxeok.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFscWhoZ3lzdmVodGdrd3N4ZW9rIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDE0ODg2NSwiZXhwIjoyMDk1NzI0ODY1fQ.xogvgvFob-7Ir6hSLkz0pOj3GawRPRbwfz9oGuGQ90E';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var MESES = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

var clients = [
  {reg:20,nome:"Adriana Tavares de Almeida",   cidade:"Sao Paulo",    uf:"SP"},
  {reg:23,nome:"Alexandre Miranda Souza",      cidade:"Ferraz de Vasconcelos",uf:"SP"},
  {reg:3, nome:"Anthony Borges",               cidade:"Guarulhos",    uf:"SP"},
  {reg:7, nome:"Bruno Rocco Giusto",           cidade:"Sao Paulo",    uf:"SP"},
  {reg:10,nome:"Caio Vinicius Barreto dos Santos",cidade:"Sao Paulo", uf:"SP"},
  {reg:9, nome:"Danilo Tuttis T. G. dos Santos",cidade:"Jau",         uf:"SP"},
  {reg:4, nome:"Dr. Andre Ricardo G. Da Silva",cidade:"Osasco",       uf:"SP"},
  {reg:11,nome:"Dr. Renato Oliveira Ferreira da Silva",cidade:"Bauru",uf:"SP"},
  {reg:8, nome:"Fernando 021 Dental Barra",    cidade:"Rio de Janeiro",uf:"RJ"},
  {reg:22,nome:"Gilberto Ferreira Esquivel",   cidade:"Itabuna",      uf:"BA"},
  {reg:18,nome:"Henrique Falcao",              cidade:"Rio de Janeiro",uf:"RJ"},
  {reg:5, nome:"Javier Garrido",               cidade:"Sao Paulo",    uf:"SP"},
  {reg:24,nome:"Jose Ricardo de Miranda Pires",cidade:"Cruz das Almas",uf:"BA"},
  {reg:15,nome:"Julia Ando",                   cidade:"Sao Paulo",    uf:"SP"},
  {reg:21,nome:"Juliano Balseiro",             cidade:"Sao Paulo",    uf:"SP"},
  {reg:2, nome:"Leonardo Moll",                cidade:"Niteroi",      uf:"RJ"},
  {reg:16,nome:"Luiz Junior",                  cidade:"Niteroi",      uf:"RJ"},
  {reg:12,nome:"Luiz Tolentino",               cidade:"Capela do Alto",uf:"SP"},
  {reg:19,nome:"Pedro Henrique de Araujo Cruz",cidade:"Diadema",      uf:"SP"},
  {reg:6, nome:"Renan Gerhard",                cidade:"Rio de Janeiro",uf:"RJ"},
  {reg:1, nome:"Ricardo Cader",                cidade:"Rio de Janeiro",uf:"RJ"},
  {reg:13,nome:"Rodrigo Guimaraes",            cidade:"Nova Iguacu",  uf:"RJ"},
  {reg:17,nome:"Talia Estefanelli Sampaio (Dr. Alfeu)",cidade:"Osasco",uf:"SP"},
  {reg:25,nome:"Tiago Muller Pereira",         cidade:"Caxias do Sul",uf:"RS"},
  {reg:26,nome:"Raquel Ghesso Brentzel",       cidade:"Sao Paulo",    uf:"SP"},
  {reg:27,nome:"Kleber Luander",               cidade:"Sao Joao da Barra",uf:"RJ"},
  {reg:28,nome:"Luiz Carlos Figueiredo Seixas",cidade:"Rio de Janeiro",  uf:"RJ"}
];

var avatarColors = [
  ['#1d3a6e','#93c5fd'],['#0d3d2b','#4ade80'],['#2e1d6e','#c4b5fd'],
  ['#3d1d1d','#fca5a5'],['#3d2e1d','#fcd34d'],['#1d3d2b','#6ee7b7']
];

var now = new Date();
var viewMonth = now.getMonth();
var viewYear  = now.getFullYear();

function initials(n) {
  var p = n.replace(/^(Dr\.|Dra\.)\s*/i,'').trim().split(' ');
  return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();
}

function fmt(v) {
  return 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateMonthLabel() {
  document.getElementById('month-label').textContent = MESES[viewMonth] + ' ' + viewYear;
}

function changeMonth(dir) {
  viewMonth += dir;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
  updateMonthLabel();
  loadAndRender();
}

async function loadAndRender() {
  var area = document.getElementById('table-area');
  area.innerHTML = '<div class="loading"><div class="spinner"></div><p>Carregando dados...</p></div>';
  document.getElementById('error-area').innerHTML = '';

  try {
    var folder = viewYear + '_' + viewMonth;
    var [dbRes, storRes] = await Promise.all([
      sb.from('controle_mensal').select('*').eq('mes', viewMonth).eq('ano', viewYear),
      sb.storage.from('comprovantes').list(folder)
    ]);
    if (dbRes.error) throw dbRes.error;

    // Build comprovante map from Storage (path: {y}_{m}/reg{reg}_{ts}.ext)
    var compMap = {};
    if (!storRes.error && storRes.data) {
      storRes.data.forEach(function(f) {
        var match = f.name.match(/^reg(\d+)_/);
        if (match) {
          var reg = parseInt(match[1]);
          if (!compMap[reg]) compMap[reg] = [];
          compMap[reg].push({
            name: f.name,
            url: sb.storage.from('comprovantes').getPublicUrl(folder + '/' + f.name).data.publicUrl
          });
        }
      });
      Object.keys(compMap).forEach(function(k) { compMap[k].sort(function(a,b){return a.name<b.name?-1:1;}); });
    }

    var rows = dbRes.data || [];
    var stateMap = {};
    rows.forEach(function(r) {
      stateMap[r.cliente_reg] = {
        recebido:         !!r.recebido,
        enviado:          !!r.enviado,
        quitado:          !!r.quitado,
        valor_mes:        Number(r.valor_mes)        || 0,
        valor_pago:       Number(r.valor_pago)       || 0,
        valor_componente: Number(r.valor_componente) || 0,
        obs_pagamento:    r.obs_pagamento            || '',
        comprovantes:     compMap[r.cliente_reg]     || []
      };
    });
    // Add clients that have comprovantes but no DB row yet
    Object.keys(compMap).forEach(function(k) {
      var reg = parseInt(k);
      if (!stateMap[reg]) stateMap[reg] = {recebido:false,enviado:false,quitado:false,valor_mes:0,valor_pago:0,valor_componente:0,obs_pagamento:'',comprovantes:compMap[reg]};
    });

    renderSummary(stateMap);
    renderTable(stateMap);
  } catch(e) {
    console.error('loadAndRender:', e);
    document.getElementById('error-area').innerHTML =
      '<div class="error-box"><i class="ti ti-alert-triangle"></i><p>' + escHtml(e.message || 'Erro ao conectar com o banco de dados') + '</p></div>';
    area.innerHTML = '';
    clearSummary();
  }
}

function clearSummary() {
  ['sum-total','sum-quit','sum-quit-pct','sum-valor','sum-pago','sum-pago-pct'].forEach(function(id) {
    var el = document.getElementById(id); if (el) el.textContent = '-';
  });
}

function renderSummary(stateMap) {
  var total   = clients.length;
  var quitados = 0, pendentes = 0;
  var totalValor = 0, totalPago = 0;

  clients.forEach(function(c) {
    var s = stateMap[c.reg] || {};
    if (s.quitado) quitados++;
    else pendentes++;
    totalValor += s.valor_mes || 0;
    totalPago  += s.valor_pago || 0;
  });

  document.getElementById('sum-total').textContent = total;
  document.getElementById('sum-quit').textContent  = quitados;
  document.getElementById('sum-quit-pct').textContent = Math.round(quitados/total*100) + '% quitados';
  document.getElementById('sum-valor').textContent = fmt(totalValor);
  document.getElementById('sum-pago').textContent  = fmt(totalPago);
  var pct = totalValor > 0 ? Math.round(totalPago/totalValor*100) : 0;
  document.getElementById('sum-pago-pct').textContent = pct + '% do faturado';
}

function renderTable(stateMap) {
  var area = document.getElementById('table-area');

  var sorted = clients.slice().sort(function(a,b) {
    var sa = stateMap[a.reg] || {}, sb2 = stateMap[b.reg] || {};
    var statusScore = function(s) { return s.quitado ? 3 : s.enviado ? 2 : s.recebido ? 1 : 0; };
    var diff = statusScore(sb2) - statusScore(sa);
    if (diff !== 0) return diff;
    return a.nome.localeCompare(b.nome, 'pt-BR');
  });

  var rows = sorted.map(function(c, idx) {
    var s = stateMap[c.reg] || {};
    var col = avatarColors[c.reg % avatarColors.length];
    var bg = col[0], fg = col[1];

    var statusHtml = s.quitado
      ? '<span class="status-badge status-q"><i class="ti ti-check" style="font-size:10px;vertical-align:-1px"></i> Quitado</span>'
      : s.enviado
      ? '<span class="status-badge status-e"><i class="ti ti-check" style="font-size:10px;vertical-align:-1px"></i> Enviado</span>'
      : s.recebido
      ? '<span class="status-badge status-r"><i class="ti ti-download" style="font-size:10px;vertical-align:-1px"></i> Recebido</span>'
      : '<span class="status-badge status-p">Pendente</span>';

    function tick(on, icon, lbl) {
      return '<div class="tick-wrap"><div class="tick ' + (on?'on':'off') + '"><i class="ti ' + icon + '" style="font-size:11px"></i></div><span class="tick-lbl' + (on?' on':'') + '">' + lbl + '</span></div>';
    }
    var ticksHtml = '<div class="ticks-row">' +
      tick(s.recebido, 'ti-download',      'receb.') +
      tick(s.enviado,  'ti-upload',        'enviado') +
      tick(s.quitado,  'ti-circle-check',  'quitado') +
      '</div>';

    var vm = s.valor_mes  || 0;
    var vp = s.valor_pago || 0;
    var valorMesHtml = vm > 0 ? '<span class="valor-mes">' + fmt(vm) + '</span>' : '<span class="valor-zero">-</span>';
    var valorPagoHtml = vp > 0 ? '<span class="valor-pago">' + fmt(vp) + '</span>' : '<span class="valor-zero">-</span>';

    var comps = s.comprovantes || [];
    var compHtml = comps.length
      ? comps.map(function(item, idx) {
          return '<a class="comp-btn" href="' + escHtml(item.url) + '" target="_blank" rel="noopener" style="margin-bottom:3px"><i class="ti ti-paperclip" style="font-size:12px"></i> ' + (comps.length > 1 ? 'Ver ' + (idx+1) : 'Ver') + '</a>';
        }).join('')
      : '<span class="no-comp">-</span>';

    return '<tr>' +
      '<td><div class="name-cell"><div class="avatar" style="background:' + bg + ';color:' + fg + '">' + initials(c.nome) + '</div><div><div class="client-name">' + escHtml(c.nome) + '</div><div class="client-city">' + escHtml(c.cidade + ' / ' + c.uf) + '</div></div></div></td>' +
      '<td>' + statusHtml + '</td>' +
      '<td>' + ticksHtml + '</td>' +
      '<td>' + valorMesHtml + '</td>' +
      '<td>' + valorPagoHtml + '</td>' +
      '<td><div style="display:flex;flex-direction:column;gap:3px;align-items:flex-start">' + compHtml + '</div></td>' +
      '</tr>';
  }).join('');

  area.innerHTML = '<table class="rel-table">' +
    '<thead><tr>' +
    '<th>Cliente</th>' +
    '<th>Status</th>' +
    '<th>Tiques</th>' +
    '<th>Valor mês</th>' +
    '<th>Valor pago</th>' +
    '<th>Comprovante</th>' +
    '</tr></thead>' +
    '<tbody>' + rows + '</tbody>' +
    '</table>';
}

// init
updateMonthLabel();
document.getElementById('gen-date').textContent = new Date().toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
loadAndRender();
</script>
</body>
</html>
