<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos — Ideali Lab</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <link rel="stylesheet" href="shared.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
</head>
<body>
<div id="shared-shell"></div>

<div class="app-header">
  <div style="display:flex;align-items:center;gap:10px">
    <button onclick="openSidebar()" style="width:36px;height:36px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.12);background:#22263a;color:#94a3b8;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">&#9776;</button>
    <div>
      <p style="font-size:17px;font-weight:500;color:#f1f5f9">Pedidos</p>
      <p id="ped-summary" style="font-size:12px;color:#64748b;margin-top:1px">0 pedidos</p>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span id="relogio" style="font-size:11px;color:#4a5568"></span>
    <span id="sync-status" style="font-size:12px;color:#64748b"><span class="sync-dot" id="sync-dot"></span>Conectado</span>
    <button class="cad-btn-primary" onclick="openPedidoPanel(null)"><i class="ti ti-plus" style="font-size:15px"></i> Novo Pedido</button>
  </div>
</div>

<div id="pp-overlay" onclick="closePedidoPanel()"></div>
<div id="pp-panel">
  <div class="cp-header">
    <div style="flex:1;min-width:0">
      <p id="pp-title" style="font-size:15px;font-weight:600;color:#f1f5f9">Novo Pedido</p>
      <p id="pp-subtitle" style="font-size:11px;color:#64748b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Preencha os dados</p>
    </div>
    <button class="sb-close" onclick="closePedidoPanel()"><i class="ti ti-x"></i></button>
  </div>
  <div class="cp-body" id="pp-body"></div>
  <div class="cp-footer">
    <button class="cad-btn-ghost" onclick="closePedidoPanel()">Cancelar</button>
    <button class="cad-btn-primary" id="pp-save-btn" onclick="savePedidoPanel()"><i class="ti ti-device-floppy" style="font-size:14px"></i> Salvar</button>
  </div>
</div>

<!-- ── Tabs de visão ─────────────────────────────────────────── -->
<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:0.75rem">
  <button id="ped-tab-lista" onclick="pedSwitchView('lista')" style="padding:7px 16px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.12);background:#3b82f6;color:#f1f5f9;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s">📋 Pedidos</button>
  <button id="ped-tab-resumo" onclick="pedSwitchView('resumo')" style="padding:7px 16px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.12);background:#22263a;color:#94a3b8;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s">📊 Por Mês</button>
</div>

<main id="page-content">
<div id="ped-view-lista">
  <!-- ── Navegação de mês ──────────────────────────────────────── -->
  <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:0.75rem">
    <button onclick="pedPrevMonth()" style="width:32px;height:32px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.12);background:#22263a;color:#94a3b8;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.15s" title="Mês anterior"><i class="ti ti-chevron-left"></i></button>
    <span id="ped-month-label" style="font-size:14px;font-weight:600;color:#f1f5f9;min-width:150px;text-align:center;user-select:none">Carregando...</span>
    <button onclick="pedNextMonth()" style="width:32px;height:32px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.12);background:#22263a;color:#94a3b8;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.15s" title="Próximo mês"><i class="ti ti-chevron-right"></i></button>
  </div>
  <div class="card" id="ped-total-card" style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 22px;margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:14px">
      <div style="width:46px;height:46px;border-radius:12px;background:rgba(74,222,128,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <i class="ti ti-currency-dollar" style="font-size:24px;color:#4ade80" id="ped-total-icon"></i>
      </div>
      <div>
        <p style="font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px">Total em pedidos — <span id="ped-total-mes">—</span></p>
        <p id="ped-total-valor" style="font-size:34px;font-weight:800;color:#4ade80;line-height:1.15;letter-spacing:-0.01em">R$ 0,00</p>
      </div>
    </div>
    <div id="ped-total-count" style="display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:12px;white-space:nowrap;flex-shrink:0">
      <i class="ti ti-clipboard-list" id="ped-total-count-icon" style="font-size:24px"></i>
      <span id="ped-total-count-text" style="font-size:22px;font-weight:800;letter-spacing:-0.01em">0 pedidos</span>
    </div>
  </div>
  <p style="font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:0.07em;margin:0 0 8px 2px">Por material</p>
  <div id="ped-material-breakdown" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px"></div>
  <p style="font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:0.07em;margin:0 0 8px 2px">Top clientes do mês</p>
  <div id="ped-cliente-ranking" style="margin-bottom:1rem"></div>
  <div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap">
    <div style="flex:1;min-width:180px;position:relative">
      <i class="ti ti-search" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;color:#4a5568"></i>
      <input type="text" id="ped-search" placeholder="Buscar por cliente ou descrição..." style="width:100%;padding-left:34px" oninput="renderPedidosTable()">
    </div>
    <select id="ped-status-filter" style="width:140px" onchange="renderPedidosTable()">
      <option value="">Todos status</option>
      <option value="orcamento">Orçamento</option>
      <option value="producao">Produção</option>
      <option value="finalizado">Finalizado</option>
      <option value="entregue">Entregue</option>
      <option value="cancelado">Cancelado</option>
    </select>
    <select id="ped-cliente-filter" style="width:180px" onchange="renderPedidosTable()">
      <option value="">Todos os clientes</option>
    </select>
    <button id="ped-recent-btn" onclick="pedToggleRecentSort()" title="Ordenar pelos pedidos cadastrados mais recentemente" style="height:36px;padding:0 12px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.12);background:#22263a;color:#94a3b8;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:all 0.15s"><i class="ti ti-clock" style="font-size:14px"></i> Últimos cadastrados</button>
    <button id="ped-clear-filters" onclick="pedClearFilters()" style="display:none;height:36px;padding:0 12px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.12);background:#22263a;color:#94a3b8;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap">&#10005; Limpar</button>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    <div style="overflow-x:auto;max-height:65vh">
      <table class="cad-table">
        <thead><tr>
          <th style="width:40px">#</th>
          <th style="cursor:pointer;user-select:none" onclick="pedSortBy('cliente')">Cliente <span id="ped-arrow-cliente" style="display:inline-block;width:12px"></span></th>
          <th>Paciente</th>
          <th style="cursor:pointer;user-select:none" onclick="pedSortBy('descricao')">Descrição <span id="ped-arrow-descricao" style="display:inline-block;width:12px"></span></th>
          <th style="cursor:pointer;user-select:none" onclick="pedSortBy('criado')">Data Cadastro <span id="ped-arrow-criado" style="display:inline-block;width:12px"></span></th>
          <th style="cursor:pointer;user-select:none" onclick="pedSortBy('previsto')">Data Prevista <span id="ped-arrow-previsto" style="display:inline-block;width:12px"></span></th>
          <th style="cursor:pointer;user-select:none" onclick="pedSortBy('valor')">Valor <span id="ped-arrow-valor" style="display:inline-block;width:12px"></span></th>
          <th style="cursor:pointer;user-select:none" onclick="pedSortBy('status')">Status <span id="ped-arrow-status" style="display:inline-block;width:12px"></span></th>
        </tr></thead>
        <tbody id="ped-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
<div id="ped-view-resumo" style="display:none">
  <div id="ped-resumo-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px"></div>
</div>
</main>

<script>
var pedidos = [];
var selectedPedidoId = null;
var pedSortCol = null, pedSortDir = null;
var PED_SORT_COLS = ['cliente','descricao','criado','previsto','valor','status'];
var PED_STATUS_ORDER = ['orcamento','producao','finalizado','entregue','cancelado'];
var PED_STATUS = {
  orcamento: {l:'Orçamento', c:'#64748b', bg:'rgba(100,116,139,0.15)'},
  producao:  {l:'Produção',  c:'#3b82f6', bg:'rgba(59,130,246,0.15)'},
  finalizado:{l:'Finalizado',c:'#22c55e', bg:'rgba(34,197,94,0.15)'},
  entregue:  {l:'Entregue',  c:'#8b5cf6', bg:'rgba(139,92,246,0.15)'},
  cancelado: {l:'Cancelado', c:'#ef4444', bg:'rgba(239,68,68,0.15)'},
};

async function loadCadastroClientes() {
  try {
    var res = await sb.from('cadastro_clientes').select('*');
    if (res.error) return;
    (res.data||[]).forEach(function(row) {
      var idx = -1;
      for (var i=0;i<clients.length;i++){if(clients[i].reg===row.reg){idx=i;break;}}
      var obj={reg:row.reg,nome:row.nome||'',cpf:row.cpf||'',cro:row.cro||'',
        end:row.end_str||'',bairro:row.bairro||'',cidade:row.cidade||'',
        uf:row.uf||'',cep:row.cep||'',tel:row.tel||'',email:row.email||'',
        obs:row.obs||'',status:row.status||'ativo'};
      if(idx>=0)clients[idx]=obj; else clients.push(obj);
    });
    clients.sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR');});
  } catch(e) { console.warn('[loadCadastroClientes]', e); }
}

async function loadPedidos() {
  try {
    var res = await sb.from('pedidos').select('*').order('created_at',{ascending:false});
    if (res.error) throw res.error;
    pedidos = res.data || [];
  } catch(e) { console.error('loadPedidos:',e); pedidos=[]; }
  populatePedidoClientFilter();
  renderPedidosTable();
}

var pedCurView = 'lista';

function pedSwitchView(view) {
  pedCurView = view;
  var lv = document.getElementById('ped-view-lista'), rv = document.getElementById('ped-view-resumo');
  var tl = document.getElementById('ped-tab-lista'), tr = document.getElementById('ped-tab-resumo');
  if (lv) lv.style.display = view === 'lista' ? '' : 'none';
  if (rv) rv.style.display = view === 'resumo' ? '' : 'none';
  if (tl) { tl.style.background = view === 'lista' ? '#3b82f6' : '#22263a'; tl.style.color = view === 'lista' ? '#f1f5f9' : '#94a3b8'; }
  if (tr) { tr.style.background = view === 'resumo' ? '#3b82f6' : '#22263a'; tr.style.color = view === 'resumo' ? '#f1f5f9' : '#94a3b8'; }
  if (view === 'resumo') renderResumoMensal();
}

function pedGoToMonth(mes, ano) {
  viewMonth = mes;
  viewYear = ano;
  localStorage.setItem('ideali-viewMonth', viewMonth);
  localStorage.setItem('ideali-viewYear', viewYear);
  updatePedMonthLabel();
  populatePedidoClientFilter();
  renderPedidosTable();
  pedSwitchView('lista');
}

function renderResumoMensal() {
  var grid = document.getElementById('ped-resumo-grid');
  if (!grid) return;
  var byMonth = {};
  pedidos.forEach(function(p) {
    var ds = (p.created_at || '').substring(0, 7);
    if (ds.length !== 7) return;
    var key = ds;
    if (!byMonth[key]) byMonth[key] = { ano: parseInt(ds.substring(0,4)), mes: parseInt(ds.substring(5,7)) - 1, total: 0, valor: 0, clientes: {} };
    byMonth[key].total++;
    byMonth[key].valor += Number(p.valor || 0);
    if (p.cliente_reg) byMonth[key].clientes[p.cliente_reg] = true;
  });
  var keys = Object.keys(byMonth).sort(function(a, b) { return b.localeCompare(a); });
  if (!keys.length) {
    grid.innerHTML = '<p style="color:#64748b;font-size:13px;grid-column:1/-1;text-align:center;padding:2rem 0">Nenhum pedido cadastrado ainda.</p>';
    return;
  }
  var maxValor = keys.reduce(function(m, k) { return Math.max(m, byMonth[k].valor); }, 0);
  grid.innerHTML = keys.map(function(k) {
    var m = byMonth[k];
    var nClientes = Object.keys(m.clientes).length;
    var pct = maxValor > 0 ? Math.max(2, Math.round((m.valor / maxValor) * 100)) : 0;
    return '<div class="card" onclick="pedGoToMonth(' + m.mes + ',' + m.ano + ')" style="cursor:pointer;transition:all 0.15s" onmouseover="this.style.borderColor=\'rgba(59,130,246,0.4)\'" onmouseout="this.style.borderColor=\'rgba(255,255,255,0.08)\'">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">' +
        '<p style="font-size:14px;font-weight:600;color:#f1f5f9">' + MESES[m.mes] + ' ' + m.ano + '</p>' +
        '<span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:rgba(139,92,246,0.15);color:#c4b5fd;white-space:nowrap">' + nClientes + ' cliente' + (nClientes !== 1 ? 's' : '') + '</span>' +
      '</div>' +
      '<p style="font-size:12px;color:#64748b;margin-bottom:2px">' + m.total + ' pedido' + (m.total !== 1 ? 's' : '') + '</p>' +
      '<p style="font-size:20px;font-weight:700;color:#4ade80;margin-bottom:10px">' + fmt(m.valor) + '</p>' +
      '<div style="height:6px;border-radius:3px;background:#22263a;overflow:hidden">' +
        '<div style="height:100%;width:' + pct + '%;border-radius:3px;background:#3b82f6"></div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function pedMonthMatch(p) {
  var ds = (p.created_at || '').substring(0, 7);
  var dy = parseInt(ds.substring(0, 4)), dm = parseInt(ds.substring(5, 7)) - 1;
  return dm === viewMonth && dy === viewYear;
}

function updatePedMonthLabel() {
  var el = document.getElementById('ped-month-label');
  if (el) el.textContent = MESES[viewMonth] + ' ' + viewYear;
}

function pedPrevMonth() {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  localStorage.setItem('ideali-viewMonth', viewMonth);
  localStorage.setItem('ideali-viewYear', viewYear);
  updatePedMonthLabel();
  populatePedidoClientFilter();
  renderPedidosTable();
}

function pedNextMonth() {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  localStorage.setItem('ideali-viewMonth', viewMonth);
  localStorage.setItem('ideali-viewYear', viewYear);
  updatePedMonthLabel();
  populatePedidoClientFilter();
  renderPedidosTable();
}

function populatePedidoClientFilter() {
  var sel = document.getElementById('ped-cliente-filter');
  if (!sel) return;
  var cur = sel.value;
  var regs = [];
  pedidos.filter(pedMonthMatch).forEach(function(p){
    if (p.cliente_reg && regs.indexOf(p.cliente_reg) < 0) regs.push(p.cliente_reg);
  });
  var opts = regs
    .map(function(r){ return {reg:r, nome:cliNomePed(r)}; })
    .filter(function(x){ return x.nome && x.nome !== '—'; })
    .sort(function(a,b){ return a.nome.localeCompare(b.nome,'pt-BR'); });
  sel.innerHTML = '<option value="">Todos os clientes</option>' +
    opts.map(function(x){ return '<option value="'+x.reg+'"'+(cur==x.reg?' selected':'')+'>'+escHtml(x.nome)+'</option>'; }).join('');
}

function pedSortBy(col) {
  if (pedSortCol !== col) { pedSortCol = col; pedSortDir = 'asc'; }
  else if (pedSortDir === 'asc') { pedSortDir = 'desc'; }
  else { pedSortCol = null; pedSortDir = null; }
  renderPedidosTable();
}

function pedSortValue(p, col) {
  switch (col) {
    case 'cliente':   return (p.cliente_reg ? cliNomePed(p.cliente_reg) : '').toLowerCase();
    case 'descricao': return (p.descricao || '').toLowerCase();
    case 'criado':    return p.created_at ? new Date(p.created_at).getTime() : 0;
    case 'previsto':  return p.data_prevista ? new Date(p.data_prevista).getTime() : Infinity;
    case 'valor':     return Number(p.valor || 0);
    case 'status':    return PED_STATUS_ORDER.indexOf(p.status);
    default: return '';
  }
}

function updatePedSortArrows() {
  PED_SORT_COLS.forEach(function(c) {
    var el = document.getElementById('ped-arrow-'+c);
    if (!el) return;
    el.textContent = pedSortCol === c ? (pedSortDir === 'asc' ? '↑' : '↓') : '';
  });
}

function pedClearFilters() {
  var s = document.getElementById('ped-search');         if (s) s.value = '';
  var sf = document.getElementById('ped-status-filter');  if (sf) sf.value = '';
  var cf = document.getElementById('ped-cliente-filter'); if (cf) cf.value = '';
  pedSortCol = null; pedSortDir = null;
  renderPedidosTable();
}

function pedToggleRecentSort() {
  if (pedSortCol === 'criado' && pedSortDir === 'desc') { pedSortCol = null; pedSortDir = null; }
  else { pedSortCol = 'criado'; pedSortDir = 'desc'; }
  renderPedidosTable();
}

function updatePedRecentBtn() {
  var btn = document.getElementById('ped-recent-btn');
  if (!btn) return;
  var active = pedSortCol === 'criado' && pedSortDir === 'desc';
  btn.style.background = active ? '#3b82f6' : '#22263a';
  btn.style.color = active ? '#f1f5f9' : '#94a3b8';
  btn.style.borderColor = active ? '#3b82f6' : 'rgba(255,255,255,0.12)';
}

function updatePedClearBtn(q, sf, cf) {
  var btn = document.getElementById('ped-clear-filters');
  if (!btn) return;
  btn.style.display = (!!q || !!sf || !!cf || !!pedSortCol) ? '' : 'none';
}

var PED_MAT_INFO = {
  zirconia: {l:'Zircônia', icon:'ti-diamond'},
  emax:     {l:'Emax',     icon:'ti-sparkles'},
  pmma:     {l:'PMMA',     icon:'ti-flask'},
  resina:   {l:'Resina',   icon:'ti-droplet'},
  misto:    {l:'Misto',    icon:'ti-color-swatch'},
  outro:    {l:'Outro',    icon:'ti-package'}
};

function pedMaterialColor(mat) {
  var t = T();
  return {zirconia:t.accent, emax:t.accent2, pmma:t.warn, resina:t.muted, misto:t.dim, outro:t.muted}[mat] || t.muted;
}

function renderPedSummaryBreakdown(filtered) {
  var matEl = document.getElementById('ped-material-breakdown');
  if (matEl) {
    var byMat = {};
    filtered.forEach(function(p){ if (!p.material) return; byMat[p.material] = (byMat[p.material]||0) + Number(p.valor||0); });
    var matKeys = Object.keys(PED_MAT_INFO).filter(function(m){ return byMat[m] > 0; });
    matEl.innerHTML = matKeys.length ? matKeys.map(function(m){
      var col = pedMaterialColor(m);
      return '<div class="card" style="padding:16px 20px;display:flex;align-items:center;gap:14px;border:1px solid '+hexToRgba(col,0.4)+';background:'+hexToRgba(col,0.05)+'">'+
        '<div style="width:48px;height:48px;border-radius:12px;background:'+hexToRgba(col,0.15)+';display:flex;align-items:center;justify-content:center;flex-shrink:0">'+
          '<i class="ti '+PED_MAT_INFO[m].icon+'" style="font-size:24px;color:'+col+'"></i>'+
        '</div>'+
        '<div style="min-width:0">'+
          '<p style="font-size:11px;font-weight:600;color:'+col+';text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px">'+PED_MAT_INFO[m].l+'</p>'+
          '<p style="font-size:28px;font-weight:800;color:'+col+';line-height:1.1;letter-spacing:-0.01em;white-space:nowrap">'+fmt(byMat[m])+'</p>'+
        '</div>'+
      '</div>';
    }).join('') : '<p style="font-size:13px;color:#4a5568">Sem dados de material neste período.</p>';
  }
  var rkEl = document.getElementById('ped-cliente-ranking');
  if (rkEl) {
    var byCli = {};
    filtered.forEach(function(p){
      var key = p.cliente_reg || 0;
      if (!byCli[key]) byCli[key] = { nome: p.cliente_reg ? cliNomePed(p.cliente_reg) : 'Sem cliente', total: 0 };
      byCli[key].total += Number(p.valor||0);
    });
    var ranking = Object.keys(byCli).map(function(k){ return byCli[k]; }).sort(function(a,b){ return b.total - a.total; }).slice(0,5);
    if (!ranking.length) {
      rkEl.innerHTML = '<p style="font-size:13px;color:#4a5568">Sem dados neste período.</p>';
    } else {
      var t = T();
      var leader = ranking[0];
      var rest = ranking.slice(1);
      var sizes = [22, 18, 15, 13]; // fonte decrescente para #2..#5
      var leaderHtml =
        '<div class="card" style="padding:20px 26px;display:flex;align-items:center;gap:16px;border:1.5px solid '+hexToRgba(t.success,0.55)+';background:'+hexToRgba(t.success,0.08)+';box-shadow:0 0 24px '+hexToRgba(t.success,0.12)+';margin-bottom:10px;position:relative">'+
          '<span style="font-size:30px;flex-shrink:0">🏆</span>'+
          '<div style="min-width:0;flex:1">'+
            '<p style="font-size:11px;font-weight:700;color:'+t.success+';text-transform:uppercase;letter-spacing:0.07em;margin-bottom:3px">#1 do mês · '+escHtml(leader.nome)+'</p>'+
            '<p style="font-size:36px;font-weight:800;color:'+t.success+';line-height:1.1;letter-spacing:-0.01em">'+fmt(leader.total)+'</p>'+
          '</div>'+
        '</div>';
      var restHtml = rest.length ? '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">'+
        rest.map(function(r, i){
          var fs = sizes[i] || 12;
          return '<div class="card" style="padding:'+(12-i)+'px '+(16-i*2)+'px;flex:1;min-width:140px;border:0.5px solid rgba(255,255,255,0.08)">'+
            '<p style="font-size:10px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">#'+(i+2)+' · '+escHtml(r.nome)+'</p>'+
            '<p style="font-size:'+fs+'px;font-weight:700;color:#94a3b8;line-height:1.1">'+fmt(r.total)+'</p>'+
          '</div>';
        }).join('') +
      '</div>' : '';
      rkEl.innerHTML = leaderHtml + restHtml;
    }
  }
}

function pedPacienteNome(p) {
  var m = (p.descricao || '').match(/^Pac\s+(.+?)\s+-\s+([\s\S]*)$/);
  return m ? m[1] : (p.descricao || '—');
}

function pedMaterialSummary(p) {
  var info = p.material && PED_MAT_INFO[p.material];
  if (!info) return '';
  var col = pedMaterialColor(p.material);
  return '<div style="display:flex;align-items:center;gap:5px;margin-top:4px;font-size:10.5px;color:'+T().muted+'">'+
    '<span style="display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:5px;background:'+hexToRgba(col,0.15)+';color:'+col+';font-weight:600;white-space:nowrap"><i class="ti '+info.icon+'" style="font-size:11px"></i>'+info.l+'</span>'+
    '<span style="white-space:nowrap">'+(p.qtd_elementos||1)+' elem.</span>'+
  '</div>';
}

function renderPedidosTable() {
  var q=(document.getElementById('ped-search')||{value:''}).value.toLowerCase().trim();
  var sf=(document.getElementById('ped-status-filter')||{value:''}).value;
  var cf=parseInt((document.getElementById('ped-cliente-filter')||{value:''}).value)||0;
  var filtered=pedidos.filter(function(p){
    if(!pedMonthMatch(p))return false;
    if(sf&&p.status!==sf)return false;
    if(cf&&p.cliente_reg!==cf)return false;
    var cn=p.cliente_reg?cliNomePed(p.cliente_reg):'';
    return !q||[p.descricao||'',cn,p.observacao||''].join(' ').toLowerCase().includes(q);
  });
  if (pedSortCol) {
    filtered = filtered.slice().sort(function(a,b){
      var va=pedSortValue(a,pedSortCol), vb=pedSortValue(b,pedSortCol);
      var cmp = typeof va==='string' ? va.localeCompare(vb,'pt-BR') : (va-vb);
      return pedSortDir==='desc' ? -cmp : cmp;
    });
  }
  updatePedSortArrows();
  updatePedRecentBtn();
  updatePedClearBtn(q, sf, cf);
  var tot=filtered.length, totVal=filtered.reduce(function(s,p){return s+Number(p.valor||0);},0);
  var se=document.getElementById('ped-summary');
  var mesLabel = MESES[viewMonth] + ' ' + viewYear;
  if(se)se.textContent=mesLabel+' · '+tot+' pedido'+(tot!==1?'s':'');
  var tvEl=document.getElementById('ped-total-valor');
  if(tvEl){tvEl.textContent=fmt(totVal);tvEl.style.color=T().success;}
  var tiEl=document.getElementById('ped-total-icon');
  if(tiEl){tiEl.style.color=T().success;if(tiEl.parentElement)tiEl.parentElement.style.background=hexToRgba(T().success,0.12);}
  var tmEl=document.getElementById('ped-total-mes');
  if(tmEl)tmEl.textContent=mesLabel;
  var tcEl=document.getElementById('ped-total-count');
  if(tcEl){
    var tcTxt=document.getElementById('ped-total-count-text');
    var tcIc=document.getElementById('ped-total-count-icon');
    var tcCol=T().accent;
    if(tcTxt)tcTxt.textContent=tot+' pedido'+(tot!==1?'s':'');
    if(tcTxt)tcTxt.style.color=T().text;
    if(tcIc)tcIc.style.color=tcCol;
    tcEl.style.background=hexToRgba(tcCol,0.14);
    tcEl.style.border='1px solid '+hexToRgba(tcCol,0.4);
  }
  renderPedSummaryBreakdown(filtered);
  var tb=document.getElementById('ped-tbody');if(!tb)return;
  tb.innerHTML=filtered.map(function(p,i){
    var st=PED_STATUS[p.status]||PED_STATUS.orcamento;
    return '<tr onclick="openPedidoPanel(\''+p.id+'\')">'+
      '<td style="color:#4a5568;font-size:11px">'+(i+1)+'</td>'+
      '<td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500">'+
        (p.cliente_reg?escHtml(cliNomePed(p.cliente_reg))+cliRegraBadgeHtml(p.cliente_reg):'<span style="color:#4a5568">—</span>')+'</td>'+
      '<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e2e8f0">'+escHtml(pedPacienteNome(p))+'</td>'+
      '<td style="max-width:220px;color:#94a3b8">'+
        '<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escHtml(p.descricao||'—')+'</div>'+
        pedMaterialSummary(p)+
      '</td>'+
      '<td style="color:#64748b;white-space:nowrap">'+fmtCreatedAt(p.created_at)+'</td>'+
      '<td style="white-space:nowrap">'+(p.data_prevista
        ? '<span style="color:#64748b">'+fmtDate(p.data_prevista)+'</span>'
        : '<span style="color:#4a5568;font-style:italic">'+addWorkdays(p.created_at||new Date().toISOString(),7)+'*</span>')+'</td>'+
      '<td style="color:'+T().success+';font-weight:700;font-size:15px;white-space:nowrap">'+fmt(p.valor||0)+'</td>'+
      '<td style="white-space:nowrap"><span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:6px;background:'+st.bg+';color:'+st.c+'">'+st.l+'</span>'+(p.urgente?' <span style="font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:#3d1d1d;color:#fca5a5">🚨</span>':'')+' </td>'+
    '</tr>';
  }).join('');
}

function openPedidoPanel(id) {
  selectedPedidoId = id;
  var p = id ? pedidos.find(function(x){return x.id===id;}) : null;
  var te=document.getElementById('pp-title'),se=document.getElementById('pp-subtitle');
  if(te)te.textContent=p?'Editar Pedido':'Novo Pedido';
  if(se)se.textContent=p?(p.descricao||'Pedido'):'Preencha os dados do pedido';
  var sc=clients.slice().sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR');});
  var cliOpts='<option value="">— Nenhum —</option>'+sc.map(function(c){
    return '<option value="'+c.reg+'"'+(p&&p.cliente_reg==c.reg?' selected':'')+'>'+escHtml(c.nome)+'</option>';
  }).join('');
  var stOpts=Object.keys(PED_STATUS).map(function(k){
    var sel=(p&&p.status===k)||(!p&&k==='orcamento');
    return '<option value="'+k+'"'+(sel?' selected':'')+'>'+PED_STATUS[k].l+'</option>';
  }).join('');
  var clienteHeader='';
  if(p&&p.cliente_reg){
    var c=clients.find(function(x){return x.reg==p.cliente_reg;});
    if(c){var col=avatarColors[c.reg%avatarColors.length];
      clienteHeader='<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:#22263a;border-radius:10px;margin-bottom:16px">'+
        '<div style="width:38px;height:38px;border-radius:50%;background:'+col[0]+';display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:'+col[1]+';flex-shrink:0">'+initials(c.nome)+'</div>'+
        '<div><p style="font-size:14px;font-weight:500;color:#f1f5f9">'+escHtml(c.nome)+'</p>'+
        '<p style="font-size:11px;color:#64748b">'+(c.cidade||'')+(c.cidade&&c.uf?' / '+c.uf:c.uf||'')+'</p></div></div>';
    }
  }
  var statusBtns=p?'<div class="cf-group"><label class="cf-label">Mudar status</label>'+
    '<div style="display:flex;flex-wrap:wrap;gap:6px">'+
    Object.keys(PED_STATUS).map(function(k){
      var st=PED_STATUS[k],active=p.status===k;
      return '<button onclick="changePedidoStatus(\''+k+'\')" style="padding:5px 12px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;border:0.5px solid '+st.c+';background:'+(active?st.bg:'transparent')+';color:'+(active?st.c:'#64748b')+';transition:all 0.15s">'+st.l+'</button>';
    }).join('')+'</div></div>':'';
  var body=document.getElementById('pp-body');if(!body)return;
  body.innerHTML=clienteHeader+
    '<div class="cf-group"><label class="cf-label">Cliente</label><select id="pf-cliente" style="width:100%" onchange="pedUpdateRegraBanner()">'+cliOpts+'</select></div>'+
    '<div id="pf-regra-banner"></div>'+
    '<div class="cf-group"><label class="cf-label">Descrição do serviço <span style="color:#ef4444">*</span></label>'+
      '<input type="text" id="pf-desc" style="width:100%" value="'+(p?escHtml(p.descricao||''):'')+'"></div>'+
    '<div class="cf-row2">'+
      '<div class="cf-group"><label class="cf-label">Valor (R$)</label><input type="number" id="pf-valor" style="width:100%" min="0" step="0.01" value="'+(p&&p.valor?p.valor:'')+'"></div>'+
      '<div class="cf-group"><label class="cf-label">Data prevista</label><input type="date" id="pf-data" style="width:100%" value="'+(p&&p.data_prevista?p.data_prevista:'')+'"></div>'+
    '</div>'+
    '<div class="cf-group"><label class="cf-label">Status</label><select id="pf-status" style="width:100%">'+stOpts+'</select></div>'+
    '<div class="cf-row2">'+
      '<div class="cf-group"><label class="cf-label">Material</label><select id="pf-material" style="width:100%">'+
        ['','zirconia','emax','pmma','resina','misto','outro'].map(function(m){
          var lbl={'':'— Não informado —',zirconia:'Zircônia',emax:'Emax',pmma:'PMMA',resina:'Resina',misto:'Misto',outro:'Outro'}[m];
          return '<option value="'+m+'"'+(p&&(p.material||'')===m?' selected':'')+'>'+lbl+'</option>';
        }).join('')+
      '</select></div>'+
      '<div class="cf-group"><label class="cf-label">Qtd. elementos</label><input type="number" id="pf-qtd" style="width:100%" min="1" step="1" value="'+(p&&p.qtd_elementos?p.qtd_elementos:1)+'"></div>'+
    '</div>'+
    '<div class="cf-row2">'+
      '<div class="cf-group"><label class="cf-label">Componente</label><select id="pf-componente" style="width:100%">'+
        ['','neodent','sin','implacil','outro'].map(function(c){
          var lbl={'':'— Nenhum —',neodent:'Neodent',sin:'SIN',implacil:'Implacil',outro:'Outro'}[c];
          return '<option value="'+c+'"'+(p&&(p.componente||'')===c?' selected':'')+'>'+lbl+'</option>';
        }).join('')+
      '</select></div>'+
      '<div class="cf-group"><label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:0 12px;height:100%;background:#22263a;border-radius:8px;border:0.5px solid rgba(255,255,255,0.08)">'+
        '<input type="checkbox" id="pf-implante"'+(p&&p.sobre_implante?' checked':'')+' style="width:16px;height:16px;cursor:pointer;accent-color:#3b82f6">'+
        '<span style="font-size:13px;color:#93c5fd;font-weight:500">Sobre implante</span></label></div>'+
    '</div>'+
    '<div class="cf-group"><label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 12px;background:#22263a;border-radius:8px;border:0.5px solid rgba(255,255,255,0.08)">'+
      '<input type="checkbox" id="pf-urgente"'+(p&&p.urgente?' checked':'')+' style="width:16px;height:16px;cursor:pointer;accent-color:#ef4444">'+
      '<span style="font-size:13px;color:#fca5a5;font-weight:500">🚨 Marcar como Urgente</span></label></div>'+
    '<div class="cf-group"><label class="cf-label">Observação</label>'+
      '<textarea id="pf-obs" style="width:100%;height:70px;resize:vertical;border:0.5px solid rgba(255,255,255,0.12);border-radius:8px;padding:8px 10px;font-size:13px;background:#22263a;color:#e2e8f0;outline:none;font-family:inherit">'+escHtml(p&&p.observacao||'')+'</textarea></div>'+
    statusBtns+
    '<div id="pp-error" style="display:none;font-size:12px;color:#fca5a5;background:#3d1d1d;border:0.5px solid rgba(239,68,68,0.3);border-radius:8px;padding:8px 12px"></div>';
  document.getElementById('pp-overlay').classList.add('open');
  document.getElementById('pp-panel').classList.add('open');
  pedUpdateRegraBanner();
  setTimeout(function(){var i=document.getElementById('pf-desc');if(i)i.focus();},80);
}

function pedUpdateRegraBanner() {
  var sel = document.getElementById('pf-cliente');
  var el  = document.getElementById('pf-regra-banner');
  if (!sel || !el) return;
  var reg   = sel.value ? parseInt(sel.value) : null;
  var regra = reg ? cliRegraPadrao(reg) : '';
  el.innerHTML = regra ?
    '<div style="display:flex;gap:8px;align-items:flex-start;padding:10px 12px;background:rgba(245,158,11,0.12);border:0.5px solid rgba(245,158,11,0.4);border-radius:8px;margin-bottom:14px">'+
      '<span style="font-size:15px;line-height:1.3">⚠️</span>'+
      '<div><p style="font-size:12px;font-weight:600;color:#fcd34d;margin:0 0 2px">Regra padrão deste cliente</p>'+
      '<p style="font-size:12px;color:#fde68a;margin:0">'+escHtml(regra)+'</p></div>'+
    '</div>' : '';
}

function closePedidoPanel() {
  document.getElementById('pp-overlay').classList.remove('open');
  document.getElementById('pp-panel').classList.remove('open');
  selectedPedidoId = null;
}

async function savePedidoPanel() {
  var desc=(document.getElementById('pf-desc')||{value:''}).value.trim();
  var errEl=document.getElementById('pp-error');
  if(!desc){if(errEl){errEl.textContent='Descrição é obrigatória.';errEl.style.display='block';}return;}
  if(errEl)errEl.style.display='none';
  var btn=document.getElementById('pp-save-btn');
  if(btn){btn.disabled=true;btn.style.opacity='0.55';}
  var cliReg=(document.getElementById('pf-cliente')||{value:''}).value;
  if (cliReg) desc = cliAnexarRegraPadrao(desc, parseInt(cliReg));
  var obj={
    descricao:desc,
    cliente_reg:cliReg?parseInt(cliReg):null,
    valor:parseFloat((document.getElementById('pf-valor')||{value:0}).value)||0,
    data_prevista:(document.getElementById('pf-data')||{value:null}).value||null,
    status:(document.getElementById('pf-status')||{value:'orcamento'}).value,
    observacao:(document.getElementById('pf-obs')||{value:''}).value.trim(),
    urgente:!!(document.getElementById('pf-urgente')&&document.getElementById('pf-urgente').checked),
    material:(document.getElementById('pf-material')||{value:''}).value||null,
    componente:(document.getElementById('pf-componente')||{value:''}).value||null,
    sobre_implante:!!(document.getElementById('pf-implante')&&document.getElementById('pf-implante').checked),
    qtd_elementos:parseInt((document.getElementById('pf-qtd')||{value:1}).value)||1
  };
  try {
    if(selectedPedidoId){
      var r=await sb.from('pedidos').update(obj).eq('id',selectedPedidoId);
      if(r.error)throw r.error;
    } else {
      var r2=await sb.from('pedidos').insert(obj);
      if(r2.error)throw r2.error;
    }
    closePedidoPanel();
    await loadPedidos();
  } catch(e){
    console.error('savePedidoPanel:',e);
    if(errEl){errEl.textContent=e.message||'Erro ao salvar.';errEl.style.display='block';}
  } finally {
    if(btn){btn.disabled=false;btn.style.opacity='';}
  }
}

async function changePedidoStatus(status) {
  if(!selectedPedidoId)return;
  var id=selectedPedidoId;
  var r=await sb.from('pedidos').update({status:status}).eq('id',id);
  if(r.error){console.error('changePedidoStatus:',r.error);return;}
  for(var i=0;i<pedidos.length;i++){if(pedidos[i].id===id){pedidos[i].status=status;break;}}
  openPedidoPanel(id);
  renderPedidosTable();
}

function onThemeChange() {
  renderPedidosTable();
  if (pedCurView === 'resumo') renderResumoMensal();
}

function initShell() {
  return fetch('sidebar.html')
    .then(function(r) { return r.text(); })
    .then(function(html) {
      document.getElementById('shared-shell').innerHTML = html;
      updateSidebarActive();
      var keyEl = document.getElementById('sb-groq-key');
      if (keyEl && GROQ_API_KEY) keyEl.value = GROQ_API_KEY;
    })
    .catch(function(e) { console.error('Erro ao carregar sidebar.html:', e); });
}

function hideLoading() {
  var el = document.getElementById('loading-overlay');
  if (el) el.style.display = 'none';
}

function showConnError(msg) {
  var el   = document.getElementById('conn-error');
  var msg2 = document.getElementById('conn-error-msg');
  if (el)   el.style.display  = 'flex';
  if (msg2) msg2.textContent  = msg;
}

async function init() {
  updatePedMonthLabel();
  await loadCadastroClientes();
  await loadPedidos();
  hideLoading();
}

initShell().then(function() { if (typeof init === 'function') init(); });
</script>
