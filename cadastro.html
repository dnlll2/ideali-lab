<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Clientes — Ideali Laboratório</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
</head>
<body>

<div id="shared-shell"></div>

<!-- Painel de edição de cliente -->
<div id="cp-overlay" onclick="closeClientePanel()"></div>
<div id="cp-panel">
  <div class="cp-header">
    <div style="flex:1;min-width:0">
      <p id="cp-title" style="font-size:15px;font-weight:600;color:#f1f5f9">Novo Cliente</p>
      <p id="cp-subtitle" style="font-size:11px;color:#64748b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Preencha os dados</p>
    </div>
    <button class="sb-close" onclick="closeClientePanel()"><i class="ti ti-x"></i></button>
  </div>
  <div class="cp-body" id="cp-form"></div>
  <div class="cp-footer">
    <button class="cad-btn-ghost" onclick="closeClientePanel()">Cancelar</button>
    <button class="cad-btn-primary" id="cp-save-btn" onclick="saveClientePanel()"><i class="ti ti-device-floppy" style="font-size:14px"></i> Salvar</button>
  </div>
</div>

<div style="max-width:100%">
  <div id="app-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="hamburger" onclick="openSidebar()" title="Menu">&#9776;</button>
      <div>
        <p style="font-size:22px;font-weight:500;color:#f1f5f9">👥 Cadastro de Clientes</p>
        <p style="font-size:14px;color:#64748b">Gerenciamento de clientes do laboratório</p>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span id="relogio" style="font-size:11px;color:#4a5568"></span>
      <span id="sync-status" style="font-size:12px;color:#64748b">
        <span class="sync-dot" id="sync-dot"></span>Conectado
      </span>
    </div>
  </div>

  <main id="page-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:10px">
      <div>
        <p style="font-size:18px;font-weight:600;color:#f1f5f9">👥 Clientes</p>
        <p id="cad-count" style="font-size:12px;color:#64748b;margin-top:2px">— registros</p>
      </div>
      <button class="cad-btn-primary" onclick="openClientePanel(null)"><i class="ti ti-plus" style="font-size:15px"></i> Novo Cliente</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap">
      <div style="flex:1;min-width:180px;position:relative">
        <i class="ti ti-search" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;color:#4a5568"></i>
        <input type="text" id="cad-search" placeholder="Buscar por nome, CPF, cidade..." style="width:100%;padding-left:34px" oninput="renderCadastroTable()">
      </div>
      <select id="cad-status-filter" style="width:130px" onchange="renderCadastroTable()">
        <option value="">Todos status</option>
        <option value="ativo">Ativo</option>
        <option value="inativo">Inativo</option>
      </select>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div style="overflow-x:auto;max-height:65vh">
        <table class="cad-table">
          <thead><tr>
            <th style="width:46px">#</th>
            <th>Nome</th>
            <th>CPF / CNPJ</th>
            <th>CRO</th>
            <th>Cidade / UF</th>
            <th>Telefone</th>
            <th>Status</th>
          </tr></thead>
          <tbody id="cad-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
function initShell() {
  return fetch('sidebar.html')
    .then(function(r) { return r.text(); })
    .then(function(html) {
      document.getElementById('shared-shell').innerHTML = html;
      updateSidebarActive();
      var keyEl = document.getElementById('sb-groq-key');
      if (keyEl && GROQ_API_KEY) keyEl.value = GROQ_API_KEY;
    })
    .catch(function(e) { console.error('Erro ao carregar sidebar.html:', e); });
}

function hideLoading() {
  var el = document.getElementById('loading-overlay');
  if (el) el.style.display = 'none';
}

function showConnError(msg) {
  var el   = document.getElementById('conn-error');
  var msg2 = document.getElementById('conn-error-msg');
  if (el)   el.style.display  = 'flex';
  if (msg2) msg2.textContent  = msg;
}

// ── Cadastro ──────────────────────────────────────────────────
var selectedClienteReg = null;

var avatarColors = [
  ['#1d3a6e','#93c5fd'],['#0d3d2b','#4ade80'],['#2e1d6e','#c4b5fd'],
  ['#3d1d1d','#fca5a5'],['#3d2e1d','#fcd34d'],['#1d3d2b','#6ee7b7']
];

function renderCadastroTable() {
  var q  = (document.getElementById('cad-search')        || {value:''}).value.toLowerCase().trim();
  var sf = (document.getElementById('cad-status-filter') || {value:''}).value;
  var sorted   = clients.slice().sort(function(a,b){ return a.nome.localeCompare(b.nome,'pt-BR'); });
  var filtered = sorted.filter(function(c) {
    var st = c.status || 'ativo';
    if (sf && st !== sf) return false;
    var txt = [c.nome, c.cpf||'', c.cro||'', c.cidade||'', c.uf||'', c.tel||'', c.email||''].join(' ').toLowerCase();
    return !q || txt.includes(q);
  });
  var ce = document.getElementById('cad-count');
  if (ce) ce.textContent = filtered.length + ' registro' + (filtered.length !== 1 ? 's' : '');
  var tb = document.getElementById('cad-tbody');
  if (!tb) return;
  tb.innerHTML = filtered.map(function(c) {
    var st       = c.status || 'ativo';
    var statusClr = st === 'inativo' ? '#ef4444' : '#22c55e';
    var statusBg  = 'rgba(' + (st === 'inativo' ? '239,68,68' : '34,197,94') + ',0.12)';
    var col  = avatarColors[c.reg % avatarColors.length];
    var cid  = (c.cidade||'') + (c.cidade && c.uf ? ' / ' + (c.uf||'') : c.uf ? c.uf : '—');
    return '<tr onclick="openClientePanel('+c.reg+')">' +
      '<td style="color:#4a5568;font-size:11px">' + c.reg + '</td>' +
      '<td><div style="display:flex;align-items:center;gap:8px">' +
        '<div style="width:28px;height:28px;border-radius:50%;background:'+col[0]+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:'+col[1]+';flex-shrink:0">' + initials(c.nome) + '</div>' +
        '<span style="font-weight:500">' + escHtml(c.nome) + '</span></div></td>' +
      '<td style="color:#94a3b8">' + (c.cpf||'—') + '</td>' +
      '<td style="color:#94a3b8">' + (c.cro||'—') + '</td>' +
      '<td style="color:#94a3b8">' + cid + '</td>' +
      '<td style="color:#94a3b8">' + (c.tel||'—') + '</td>' +
      '<td><span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:6px;background:'+statusBg+';color:'+statusClr+'">' + (st==='inativo'?'Inativo':'Ativo') + '</span></td>' +
    '</tr>';
  }).join('');
}

function openClientePanel(reg) {
  selectedClienteReg = reg;
  var c   = reg !== null ? clients.find(function(x){ return x.reg === reg; }) : null;
  var te  = document.getElementById('cp-title');
  var se  = document.getElementById('cp-subtitle');
  if (te) te.textContent = c ? 'Editar Cliente' : 'Novo Cliente';
  if (se) se.textContent = c ? c.nome : 'Preencha os dados do cliente';
  var form = document.getElementById('cp-form');
  if (!form) return;
  var UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
  var ufO = UFS.map(function(u){ return '<option value="'+u+'"'+(c&&c.uf===u?' selected':'')+'>'+u+'</option>'; }).join('');
  form.innerHTML =
    '<div class="cf-group"><label class="cf-label">Nome <span style="color:#ef4444">*</span></label>' +
      '<input type="text" id="cf-nome" style="width:100%" value="'+(c?escHtml(c.nome):'')+'"></div>' +
    '<div class="cf-row2">' +
      '<div class="cf-group"><label class="cf-label">CPF / CNPJ</label><input type="text" id="cf-cpf" style="width:100%" value="'+(c?escHtml(c.cpf||''):'')+'"></div>' +
      '<div class="cf-group"><label class="cf-label">CRO</label><input type="text" id="cf-cro" style="width:100%" value="'+(c?escHtml(c.cro||''):'')+'"></div>' +
    '</div>' +
    '<div class="cf-group"><label class="cf-label">Endereço</label>' +
      '<input type="text" id="cf-end" style="width:100%" value="'+(c?escHtml(c.end||''):'')+'"></div>' +
    '<div class="cf-row2">' +
      '<div class="cf-group"><label class="cf-label">Bairro</label><input type="text" id="cf-bairro" style="width:100%" value="'+(c?escHtml(c.bairro||''):'')+'"></div>' +
      '<div class="cf-group"><label class="cf-label">CEP</label><input type="text" id="cf-cep" style="width:100%" value="'+(c?escHtml(c.cep||''):'')+'"></div>' +
    '</div>' +
    '<div class="cf-row2">' +
      '<div class="cf-group"><label class="cf-label">Cidade</label><input type="text" id="cf-cidade" style="width:100%" value="'+(c?escHtml(c.cidade||''):'')+'"></div>' +
      '<div class="cf-group"><label class="cf-label">UF</label><select id="cf-uf" style="width:100%"><option value="">—</option>'+ufO+'</select></div>' +
    '</div>' +
    '<div class="cf-row2">' +
      '<div class="cf-group"><label class="cf-label">Telefone</label><input type="text" id="cf-tel" style="width:100%" value="'+(c?escHtml(c.tel||''):'')+'"></div>' +
      '<div class="cf-group"><label class="cf-label">Email</label><input type="email" id="cf-email" style="width:100%" value="'+(c?escHtml(c.email||''):'')+'"></div>' +
    '</div>' +
    '<div class="cf-group"><label class="cf-label">Observação</label>' +
      '<textarea id="cf-obs" style="width:100%;height:70px;resize:vertical;border:0.5px solid rgba(255,255,255,0.12);border-radius:8px;padding:8px 10px;font-size:13px;background:#22263a;color:#e2e8f0;outline:none;font-family:inherit">'+escHtml(c&&c.obs||'')+'</textarea></div>' +
    '<div class="cf-group"><label class="cf-label">⚠️ Regra padrão do cliente</label>' +
      '<textarea id="cf-regra-padrao" placeholder="Ex: Não cimentar componente — enviar sempre sem cimentar." style="width:100%;height:60px;resize:vertical;border:0.5px solid rgba(245,158,11,0.35);border-radius:8px;padding:8px 10px;font-size:13px;background:#22263a;color:#e2e8f0;outline:none;font-family:inherit">'+escHtml(c&&c.regraPadrao||'')+'</textarea>' +
      '<p style="font-size:11px;color:#64748b;margin-top:4px">Aparece automaticamente em novas ordens CAM e pedidos deste cliente.</p></div>' +
    '<div class="cf-group"><label class="cf-label">Status</label>' +
      '<select id="cf-status" style="width:100%">' +
        '<option value="ativo"'+((!c||c.status!=='inativo')?' selected':'')+'>Ativo</option>' +
        '<option value="inativo"'+((c&&c.status==='inativo')?' selected':'')+'>Inativo</option>' +
      '</select></div>' +
    '<div id="cp-error" style="display:none;font-size:12px;color:#fca5a5;background:#3d1d1d;border:0.5px solid rgba(239,68,68,0.3);border-radius:8px;padding:8px 12px"></div>';
  document.getElementById('cp-overlay').classList.add('open');
  document.getElementById('cp-panel').classList.add('open');
  setTimeout(function(){ var i = document.getElementById('cf-nome'); if (i) i.focus(); }, 80);
}

function closeClientePanel() {
  document.getElementById('cp-overlay').classList.remove('open');
  document.getElementById('cp-panel').classList.remove('open');
  selectedClienteReg = null;
}

async function saveClientePanel() {
  var nome  = (document.getElementById('cf-nome') || {value:''}).value.trim();
  var errEl = document.getElementById('cp-error');
  if (!nome) { if (errEl) { errEl.textContent='Nome é obrigatório.'; errEl.style.display='block'; } return; }
  if (errEl) errEl.style.display = 'none';
  var btn   = document.getElementById('cp-save-btn');
  if (btn)  { btn.disabled = true; btn.style.opacity = '0.55'; }
  var isNew = selectedClienteReg === null;
  var reg   = isNew ? clients.reduce(function(mx,c){ return Math.max(mx,c.reg); }, 0) + 1 : selectedClienteReg;
  var obj = {
    reg:  reg,
    nome: nome,
    cpf:      (document.getElementById('cf-cpf')    || {value:''}).value.trim(),
    cro:      (document.getElementById('cf-cro')    || {value:''}).value.trim(),
    end_str:  (document.getElementById('cf-end')    || {value:''}).value.trim(),
    bairro:   (document.getElementById('cf-bairro') || {value:''}).value.trim(),
    cidade:   (document.getElementById('cf-cidade') || {value:''}).value.trim(),
    uf:       (document.getElementById('cf-uf')     || {value:''}).value,
    cep:      (document.getElementById('cf-cep')    || {value:''}).value.trim(),
    tel:      (document.getElementById('cf-tel')    || {value:''}).value.trim(),
    email:    (document.getElementById('cf-email')  || {value:''}).value.trim(),
    obs:      (document.getElementById('cf-obs')    || {value:''}).value.trim(),
    status:   (document.getElementById('cf-status') || {value:'ativo'}).value,
    updated_at: new Date().toISOString()
  };
  // regraPadrao vive só no array local `clients` (shared.js), sem espelho no Supabase
  var regraPadrao = (document.getElementById('cf-regra-padrao') || {value:''}).value.trim();
  try {
    var res = await sb.from('cadastro_clientes').upsert(obj, {onConflict:'reg'});
    if (res.error) throw res.error;
    var clientObj = { reg:reg, nome:obj.nome, cpf:obj.cpf, cro:obj.cro, end:obj.end_str,
      bairro:obj.bairro, cidade:obj.cidade, uf:obj.uf, cep:obj.cep, tel:obj.tel,
      email:obj.email, obs:obj.obs, status:obj.status };
    var idx = -1;
    for (var i = 0; i < clients.length; i++) { if (clients[i].reg === reg) { idx = i; break; } }
    if (idx >= 0) clients[idx] = clientObj; else clients.push(clientObj);
    closeClientePanel();
    renderCadastroTable();
  } catch(e) {
    console.error('saveClientePanel:', e);
    if (errEl) { errEl.textContent = e.message || 'Erro ao salvar.'; errEl.style.display = 'block'; }
  } finally {
    var cReg = clients.find(function(x){ return x.reg === reg; });
    if (cReg) cReg.regraPadrao = regraPadrao;
    if (btn) { btn.disabled = false; btn.style.opacity = ''; }
  }
}

function init() {
  renderCadastroTable();
  hideLoading();
}

function initShell() {
  return fetch('sidebar.html')
    .then(function(r) { return r.text(); })
    .then(function(html) {
      document.getElementById('shared-shell').innerHTML = html;
      updateSidebarActive();
      var keyEl = document.getElementById('sb-groq-key');
      if (keyEl && GROQ_API_KEY) keyEl.value = GROQ_API_KEY;
    })
    .catch(function(e) { console.error('Erro ao carregar sidebar.html:', e); });
}

initShell().then(function() { if (typeof init === 'function') init(); });
</script>

</body>
</html>
